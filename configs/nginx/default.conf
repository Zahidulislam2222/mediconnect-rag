limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 80;
    server_name healthcodeanalysis.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name healthcodeanalysis.com;

    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Authelia forward-auth verification endpoint
    location /authelia/api/authz/forward-auth {
        internal;
        proxy_pass http://authelia:9091/api/authz/forward-auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Authelia portal — NO auth_request (it IS the auth portal)
    location /authelia/ {
        proxy_pass http://authelia:9091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lightrag/ {
        auth_request /authelia/api/authz/forward-auth;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        error_page 401 =302 https://healthcodeanalysis.com/authelia/?rd=$scheme://$host$request_uri;

        proxy_pass http://lightrag:9621/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/ {
        auth_request /authelia/api/authz/forward-auth;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        error_page 401 =302 https://healthcodeanalysis.com/authelia/?rd=$scheme://$host$request_uri;

        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /jaeger/ {
        auth_request /authelia/api/authz/forward-auth;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        error_page 401 =302 https://healthcodeanalysis.com/authelia/?rd=$scheme://$host$request_uri;

        proxy_pass http://jaeger:16686/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        auth_request /authelia/api/authz/forward-auth;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        error_page 401 =302 https://healthcodeanalysis.com/authelia/?rd=$scheme://$host$request_uri;

        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Nginx stub_status for Prometheus scraping
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # Health endpoint for Docker healthcheck
    location /health {
        access_log off;
        return 200 "healthy\n";
        # 2026-09-24: replaced by default_type below. The old add-header directive here stopped
        # the server-level security headers (HSTS, X-Frame-Options and others) applying to this
        # location and sent a second Content-Type header.
        # Previous directive, kept for reference (underscore written as a hyphen so scanners
        # do not read this comment as a live directive): add-header Content-Type text/plain;
        default_type text/plain;
    }
}
